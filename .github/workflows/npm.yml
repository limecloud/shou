name: npm distribution contracts

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Launcher and generated-package contracts
        run: |
          node --test tests/npm/launcher.test.cjs
          python tests/npm/test-packaging.py
