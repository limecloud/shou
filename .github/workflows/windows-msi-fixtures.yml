name: Generated Windows MSI fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-windows-msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generated-msi:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install, inspect and uninstall generated current-user MSI packages
        run: ./scripts/windows/test-uninstall-fixtures.ps1 -RunGeneratedMsiFixtures -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/generated-msi"
      - name: Preserve source, installer logs, TRX and generated fixture hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-msi-windows-server-2025-x64
          path: ${{ runner.temp }}/ShouBuild/generated-msi/run-*
          if-no-files-found: error
