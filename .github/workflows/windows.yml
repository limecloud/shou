name: Windows native build
on:
  push:
    branches: [main]
    paths: ["Package.*", "apps/cli/**", "apps/windows/**", "packages/**", "skills/**", "tests/windows/**", "tests/windows-closing/**", "tests/windows-tools/**", "tests/windows-uninstall/**", "tests/windows-package-data/**", "tests/windows-application-usage/**", "tests/windows-preview/**", "tests/windows-cli-launcher/**", "scripts/verify-tool-cleanup.py", "scripts/*windows*", "scripts/verify-desktop-bridge.py", "scripts/verify-storage-browsing.py", "scripts/verify-storage-coverage.py", "scripts/verify-agent-setup.py", "scripts/verify-rule-authoring.py", "scripts/verify-ai-investigation.py", ".github/workflows/windows.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["Package.*", "apps/cli/**", "apps/windows/**", "packages/**", "skills/**", "tests/windows/**", "tests/windows-closing/**", "tests/windows-tools/**", "tests/windows-uninstall/**", "tests/windows-package-data/**", "tests/windows-application-usage/**", "tests/windows-preview/**", "tests/windows-cli-launcher/**", "scripts/verify-tool-cleanup.py", "scripts/*windows*", "scripts/verify-desktop-bridge.py", "scripts/verify-storage-browsing.py", "scripts/verify-storage-coverage.py", "scripts/verify-agent-setup.py", "scripts/verify-rule-authoring.py", "scripts/verify-ai-investigation.py", ".github/workflows/windows.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or version tag to verify
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    # Swift 6.2.3 ships Clang 19; newer Visual Studio STL requires Clang 20.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report native toolchains
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { throw "Swift toolchain is unavailable." }
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw ".NET SDK is unavailable." }
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python is unavailable." }
      - name: Verify localization, documentation and rule coverage
        run: |
          python scripts/update-localizations.py --check
          if ($LASTEXITCODE -ne 0) { throw "Localization verification failed." }
          python scripts/verify-windows-localization.py
          if ($LASTEXITCODE -ne 0) { throw "Windows interface localization verification failed." }
          python scripts/verify-docs.py
          if ($LASTEXITCODE -ne 0) { throw "Documentation verification failed." }
          python scripts/verify-mole-coverage.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Rule coverage verification failed." }
      - name: Build Swift engine, native checks and WPF application
        run: ./scripts/build-windows.ps1 -Stage Build
      - name: Verify WPF, AI contracts and real desktop processes
        run: ./scripts/build-windows.ps1 -Stage Check
      - name: Package and verify self-contained Windows x64 release
        run: ./scripts/release-windows.ps1
      - name: Retain verified Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: shou-windows-release
          path: |
            dist/release-windows-*/*.zip
            dist/release-windows-*/SHA256SUMS-windows
          if-no-files-found: error
          compression-level: 0
      - name: Retain build evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-development-build
          path: |
            apps/windows/Shou.Windows/bin/Release/net10.0-windows/
            .build/x86_64-unknown-windows-msvc/release/
          if-no-files-found: error
          retention-days: 7
