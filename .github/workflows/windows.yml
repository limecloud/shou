name: Native Windows checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core, presentation, native filesystem, private records and CLI
        run: ./scripts/windows/test.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/tests"
      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-test-results
          path: ${{ runner.temp }}/ShouBuild/tests/results
          if-no-files-found: ignore

  build:
    name: Build and verify (${{ matrix.runtime }})
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'win-x64'
        with:
          node-version: '22'
      - name: Publish desktop and CLI payloads
        run: ./scripts/windows/build.ps1 -Runtime '${{ matrix.runtime }}' -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/${{ matrix.runtime }}"
      - name: Verify native x64 CLI and WinUI startup
        if: matrix.runtime == 'win-x64'
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          ./scripts/windows/verify-publish.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/win-x64/publish" -Version $Properties.Project.PropertyGroup.Version
      - name: Verify portable preview archives
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          $Source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source commit is unavailable.' }
          $Arguments = @('--payload-root', "$env:RUNNER_TEMP/ShouBuild/${{ matrix.runtime }}/publish", '--output', 'dist/windows', '--version', $Properties.Project.PropertyGroup.Version, '--runtime', '${{ matrix.runtime }}', '--source', $Source)
          if ('${{ matrix.runtime }}' -eq 'win-x64') { $Arguments += '--native-checked' }
          python scripts/package-windows.py @Arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview archive validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ matrix.runtime }}
          path: dist/windows/
          if-no-files-found: error
      - name: Stage and install private x64 npm tarballs offline
        if: matrix.runtime == 'win-x64'
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          $Version = $Properties.Project.PropertyGroup.Version
          python scripts/package-npm.py platform --development --version $Version --platform win32-x64 --payload "$env:RUNNER_TEMP/ShouBuild/win-x64/publish/cli" --licenses "$env:RUNNER_TEMP/ShouBuild/win-x64/publish/cli/notices" --output "$env:RUNNER_TEMP/ShouBuild/npm/native"
          if ($LASTEXITCODE -ne 0) { throw 'Native npm staging failed.' }
          python scripts/package-npm.py launcher --development --version $Version --platform-package "$env:RUNNER_TEMP/ShouBuild/npm/native" --output "$env:RUNNER_TEMP/ShouBuild/npm/launcher"
          if ($LASTEXITCODE -ne 0) { throw 'npm launcher staging failed.' }
          python scripts/verify-npm-distribution.py --launcher "$env:RUNNER_TEMP/ShouBuild/npm/launcher" --platform-package "$env:RUNNER_TEMP/ShouBuild/npm/native" --output "$env:RUNNER_TEMP/ShouBuild/npm/verification"
          if ($LASTEXITCODE -ne 0) { throw 'npm installation verification failed.' }
      - name: Collect npm verification receipt
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-npm-verification
          path: ${{ runner.temp }}/ShouBuild/npm/verification/verification.json
          if-no-files-found: ignore
      - name: Collect generated WinUI resources after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-resource-diagnostics-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/publish/app/*.pri
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/obj/Shou.Windows.App/**/*.xaml
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/obj/Shou.Windows.App/**/*.xbf
          if-no-files-found: ignore
