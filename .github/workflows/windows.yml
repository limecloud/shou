name: Native Windows checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core, presentation, native filesystem, private records and CLI
        run: ./scripts/windows/test.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/tests"
      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-test-results
          path: |
            ${{ runner.temp }}/ShouBuild/tests/results
            ${{ runner.temp }}/ShouBuild/tests/evidence
          if-no-files-found: ignore

  build:
    name: Build and verify (${{ matrix.runtime }})
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'win-x64'
        with:
          node-version: '22'
      - name: Publish desktop and CLI payloads
        run: ./scripts/windows/build.ps1 -Runtime '${{ matrix.runtime }}' -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/${{ matrix.runtime }}"
      - name: Verify native x64 CLI and WinUI startup
        if: matrix.runtime == 'win-x64'
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          ./scripts/windows/verify-publish.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/win-x64/publish" -Version $Properties.Project.PropertyGroup.Version
      - name: Read-only monitor UI and native tray menu
        if: matrix.runtime == 'win-x64'
        run: |
          powershell.exe -NoProfile -STA -File scripts/windows/test-monitor-ui.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/win-x64/publish" -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/win-x64/diagnostics/monitor"
          if ($LASTEXITCODE -ne 0) { throw 'Monitor UI acceptance failed.' }
      - name: Collect native x64 application diagnostics
        if: always() && matrix.runtime == 'win-x64'
        run: ./scripts/windows/collect-diagnostics.ps1 -OutputRoot "$env:RUNNER_TEMP/ShouBuild/win-x64/diagnostics" -PublishRoot "$env:RUNNER_TEMP/ShouBuild/win-x64/publish"
      - name: Upload native x64 application diagnostics
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-application-diagnostics
          path: ${{ runner.temp }}/ShouBuild/win-x64/diagnostics
          if-no-files-found: warn
      - name: Verify real PowerShell keyboard completion
        if: matrix.runtime == 'win-x64'
        run: python scripts/windows/test-shell-completion.py --cli "$env:RUNNER_TEMP/ShouBuild/win-x64/publish/cli/shou.exe" --output "$env:RUNNER_TEMP/ShouBuild/win-x64/shell-interaction"
      - name: Collect PowerShell keyboard evidence
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell-interaction
          path: ${{ runner.temp }}/ShouBuild/win-x64/shell-interaction
          if-no-files-found: warn
      - name: Verify portable preview archives
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          $Source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source commit is unavailable.' }
          $Arguments = @('--payload-root', "$env:RUNNER_TEMP/ShouBuild/${{ matrix.runtime }}/publish", '--output', 'dist/windows', '--version', $Properties.Project.PropertyGroup.Version, '--runtime', '${{ matrix.runtime }}', '--source', $Source)
          if ('${{ matrix.runtime }}' -eq 'win-x64') { $Arguments += '--native-checked' }
          python scripts/package-windows.py @Arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview archive validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-${{ matrix.runtime }}
          path: dist/windows/
          if-no-files-found: error
      - name: Stage and install private x64 npm tarballs offline
        if: matrix.runtime == 'win-x64'
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          $Version = $Properties.Project.PropertyGroup.Version
          python scripts/package-npm.py platform --development --version $Version --platform win32-x64 --payload "$env:RUNNER_TEMP/ShouBuild/win-x64/publish/cli" --licenses "$env:RUNNER_TEMP/ShouBuild/win-x64/publish/cli/notices" --output "$env:RUNNER_TEMP/ShouBuild/npm/native"
          if ($LASTEXITCODE -ne 0) { throw 'Native npm staging failed.' }
          python scripts/package-npm.py launcher --development --version $Version --platform-package "$env:RUNNER_TEMP/ShouBuild/npm/native" --output "$env:RUNNER_TEMP/ShouBuild/npm/launcher"
          if ($LASTEXITCODE -ne 0) { throw 'npm launcher staging failed.' }
          python scripts/verify-npm-distribution.py --launcher "$env:RUNNER_TEMP/ShouBuild/npm/launcher" --platform-package "$env:RUNNER_TEMP/ShouBuild/npm/native" --output "$env:RUNNER_TEMP/ShouBuild/npm/verification"
          if ($LASTEXITCODE -ne 0) { throw 'npm installation verification failed.' }
      - name: Collect npm verification receipt
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-npm-verification
          path: ${{ runner.temp }}/ShouBuild/npm/verification/verification.json
          if-no-files-found: ignore
      - name: Collect generated WinUI resources after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-resource-diagnostics-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/publish/app/*.pri
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/bin/Shou.Windows.App/**/*.pri
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/obj/Shou.Windows.App/**/*.xaml
            ${{ runner.temp }}/ShouBuild/${{ matrix.runtime }}/obj/Shou.Windows.App/**/*.xbf
          if-no-files-found: ignore

  native-arm64:
    name: Native Windows 11 ARM64
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require native ARM64 tools
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64' -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'ARM64 Windows and PowerShell are required.' }
          $Info = dotnet --info | Out-String
          if ($LASTEXITCODE -ne 0 -or $Info -notmatch 'RID:\s+win-arm64') { throw 'The .NET SDK must run natively on ARM64.' }
          Write-Output $Info
      - name: Core, presentation, native filesystem, private records and CLI
        run: ./scripts/windows/test.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/tests"
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-win-arm64
          path: ${{ runner.temp }}/ShouBuild/archives
      - name: Verify and expand the same-source ARM64 archives
        run: |
          [xml]$Properties = Get-Content apps/windows/Directory.Build.props
          $Version = $Properties.Project.PropertyGroup.Version
          $Archives = "$env:RUNNER_TEMP/ShouBuild/archives"
          foreach ($Kind in @('app', 'cli')) {
            $Stem = if ($Kind -eq 'app') { 'Shou' } else { 'shou-cli' }
            $Name = "$Stem-$Version-windows-arm64.zip"
            $Expected = @(Get-Content "$Archives/SHA256SUMS-windows-arm64" | Where-Object { $_.EndsWith("  $Name") })
            if ($Expected.Count -ne 1 -or (Get-FileHash "$Archives/$Name" -Algorithm SHA256).Hash -ine $Expected[0].Substring(0, 64)) { throw 'Archive digest differs.' }
            $Destination = "$env:RUNNER_TEMP/ShouBuild/publish/$Kind"
            Expand-Archive -LiteralPath "$Archives/$Name" -DestinationPath $Destination
            $Build = Get-Content "$Destination/BUILD.json" -Raw | ConvertFrom-Json
            if ($Build.source_commit -ne $env:GITHUB_SHA -or $Build.version -ne $Version -or $Build.runtime -ne 'win-arm64' -or $Build.kind -ne $Kind -or $Build.public_mutation_available -ne $false) { throw 'Archive source, version, runtime or gates differ.' }
            foreach ($File in $Build.files.PSObject.Properties) {
              if ((Get-FileHash -LiteralPath (Join-Path $Destination $File.Name) -Algorithm SHA256).Hash -ine $File.Value) { throw 'Published file digest differs.' }
            }
          }
          ./scripts/windows/verify-publish.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/publish" -Version $Version -Runtime win-arm64 -ReportPath "$env:RUNNER_TEMP/ShouBuild/evidence/native-publish.json"
      - name: Verify native ARM64 PowerShell keyboard completion
        run: python scripts/windows/test-shell-completion.py --cli "$env:RUNNER_TEMP/ShouBuild/publish/cli/shou.exe" --output "$env:RUNNER_TEMP/ShouBuild/evidence/shell-interaction"
      - name: Native ARM64 monitor UI and tray menu
        run: |
          powershell.exe -NoProfile -STA -File scripts/windows/test-monitor-ui.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/publish" -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/evidence/monitor"
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 monitor UI acceptance failed.' }
      - name: Collect ARM64 evidence
        if: always()
        run: ./scripts/windows/collect-diagnostics.ps1 -OutputRoot "$env:RUNNER_TEMP/ShouBuild/evidence" -TestResultsRoot "$env:RUNNER_TEMP/ShouBuild/tests/results" -PublishRoot "$env:RUNNER_TEMP/ShouBuild/publish"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm64-native-results
          path: |
            ${{ runner.temp }}/ShouBuild/tests/results
            ${{ runner.temp }}/ShouBuild/evidence
          if-no-files-found: warn
