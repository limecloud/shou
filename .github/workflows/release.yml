name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v0.18.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SHOU_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.SHOU_RELEASE_TAG }}
      - id: resolve
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    name: All tests (${{ matrix.runner }})
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Toolchain
        run: swift --version | grep -E 'Swift version 6[.]2[.]3([[:space:]]|$)'
      - name: Full tests including native Trash, restore, and permanent removal
        run: sh scripts/test.sh --native-trash-purge
      - name: Storage metadata, directory workers, and cancellation
        run: |
          SHOU_STORAGE_SCAN_WORKERS=1 .build/debug/shou-tests --storage-performance-only
          SHOU_STORAGE_SCAN_WORKERS=8 .build/debug/shou-tests --storage-performance-only
          .build/debug/shou-tests --storage-presentation-million-only
      - name: Native cleanup and restoration of more than 100,000 files
        run: .build/debug/shou-tests --native-large-trash-only
      - name: Build and verify release application
        run: sh scripts/build-macos.sh release
      - name: Packaged CLI contracts and terminal confirmations
        run: |
          python3 scripts/verify-cli.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-cli-support.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-application-updates-cli.py dist/Shou.app/Contents/Helpers/shou
          python3 apps/cli/Tests/verify-confirmation.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-native-cli.py dist/Shou.app/Contents/Helpers/shou --native-trash-purge
          python3 scripts/verify-uninstall-cli.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-application-batch-cli.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-large-files-cli.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-privacy-cli.py dist/Shou.app/Contents/Helpers/shou
          python3 scripts/verify-installed-cache-cli.py dist/Shou.app/Contents/Helpers/shou --permanent
      - name: Packaged read worker exits after its requesting parent
        run: python3 scripts/verify-read-worker-lifecycle.py --bin dist/Shou.app/Contents/Helpers/shou --evidence "$RUNNER_TEMP/shou-read-worker-lifecycle"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage and verify native npm package
        run: |
          case "$(uname -m)" in arm64) task_target=darwin-arm64 ;; x86_64) task_target=darwin-x64 ;; *) exit 1 ;; esac
          task_version="${SHOU_RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/shou-npm-notices"
          cp .build/checkouts/swift-ai-sdk/LICENSE "$RUNNER_TEMP/shou-npm-notices/SwiftAISDK-LICENSE.txt"
          python3 scripts/package-npm.py platform --version "$task_version" --platform "$task_target" --payload dist/Shou.app/Contents/Helpers --licenses "$RUNNER_TEMP/shou-npm-notices" --output "dist/npm/$task_target"
          python3 scripts/package-npm.py launcher --version "$task_version" --platform-package "dist/npm/$task_target" --output "$RUNNER_TEMP/shou-npm-launcher"
          python3 scripts/verify-npm-distribution.py --launcher "$RUNNER_TEMP/shou-npm-launcher" --platform-package "dist/npm/$task_target" --output "$RUNNER_TEMP/shou-npm-verification"
      - uses: actions/upload-artifact@v4
        with:
          name: shou-npm-${{ matrix.runner }}
          if-no-files-found: error
          path: dist/npm/

  package:
    needs: [source, verify]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Toolchain
        run: swift --version | grep -E 'Swift version 6[.]2[.]3([[:space:]]|$)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: shou-npm-*
          merge-multiple: true
          path: dist/npm
      - name: Assemble exact-version npm launcher and tarballs
        run: |
          task_version="${SHOU_RELEASE_TAG#v}"
          chmod +x dist/npm/darwin-*/vendor/shou
          python3 scripts/package-npm.py launcher --version "$task_version" --platform-package dist/npm/darwin-arm64 --platform-package dist/npm/darwin-x64 --output dist/npm/launcher
          python3 scripts/verify-npm-distribution.py --launcher dist/npm/launcher --platform-package dist/npm/darwin-arm64 --output "$RUNNER_TEMP/shou-npm-final-verification"
          mkdir -p dist/npm/tarballs
          for task_package in darwin-arm64 darwin-x64 launcher; do
            npm pack "./dist/npm/$task_package" --pack-destination dist/npm/tarballs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: shou-npm-release
          if-no-files-found: error
          path: dist/npm/
      - name: Build, test, package, and sign universal updates
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'SPARKLE_PRIVATE_KEY repository secret is required'; exit 1; }
          task_key_file="$RUNNER_TEMP/shou-update-key"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$task_key_file"
          trap 'rm -f "$task_key_file"' EXIT
          sh scripts/release-macos.sh "$SHOU_RELEASE_TAG" "$task_key_file"
      - uses: actions/upload-artifact@v4
        with:
          name: shou-release
          if-no-files-found: error
          path: |
            dist/release-*/*.dmg
            dist/release-*/*.zip
            dist/release-*/*.tar.gz
            dist/release-*/appcast.xml
            dist/release-*/SHA256SUMS

  windows:
    needs: source
    name: Windows preview (${{ matrix.runtime }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json
          cache: true
          cache-dependency-path: apps/windows/**/packages.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native x64 core, presentation, platform and CLI acceptance
        if: matrix.runtime == 'win-x64'
        run: ./scripts/windows/test.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/tests"
      - name: Build self-contained WinUI and CLI payloads
        run: ./scripts/windows/build.ps1 -Runtime '${{ matrix.runtime }}' -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/payload"
      - name: Native x64 CLI and WinUI startup
        if: matrix.runtime == 'win-x64'
        run: |
          $Version = $env:SHOU_RELEASE_TAG.Substring(1)
          ./scripts/windows/verify-publish.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/payload/publish" -Version $Version
      - name: Native x64 monitor panels and tray commands
        if: matrix.runtime == 'win-x64'
        run: |
          powershell.exe -NoProfile -STA -File scripts/windows/test-monitor-ui.ps1 -PublishRoot "$env:RUNNER_TEMP/ShouBuild/payload/publish" -ArtifactsRoot "$env:RUNNER_TEMP/ShouBuild/tests/evidence/monitor"
          if ($LASTEXITCODE -ne 0) { throw 'Release monitor UI acceptance failed.' }
      - name: Verify architecture, runtime, resources, version and archives
        run: |
          $Arguments = @('--payload-root', "$env:RUNNER_TEMP/ShouBuild/payload/publish", '--output', 'dist/windows', '--version', $env:SHOU_RELEASE_TAG.Substring(1), '--runtime', '${{ matrix.runtime }}', '--source', '${{ needs.source.outputs.commit }}')
          if ('${{ matrix.runtime }}' -eq 'win-x64') { $Arguments += '--native-checked' }
          python scripts/package-windows.py @Arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows release archive validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: shou-release-windows-${{ matrix.runtime }}
          if-no-files-found: error
          path: dist/windows/
      - name: Retain native acceptance evidence
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: shou-release-windows-test-results
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ShouBuild/tests/results
            ${{ runner.temp }}/ShouBuild/tests/evidence

  publish:
    needs: [source, package, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: shou-release
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: shou-release-windows-win-*
          merge-multiple: true
          path: windows-assets
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SHOU_SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHOU_RELEASE_TAG" --jq .sha)" = "$SHOU_SOURCE_COMMIT" || { echo 'Release tag moved; publish the new verified source instead'; exit 1; }
          task_asset_dir="$(dirname "$(find release-assets -name SHA256SUMS -print -quit)")"
          test -f "$task_asset_dir/SHA256SUMS"
          cp windows-assets/*.zip "$task_asset_dir/"
          cat windows-assets/SHA256SUMS-windows-* >> "$task_asset_dir/SHA256SUMS"
          (cd "$task_asset_dir" && sha256sum -c SHA256SUMS)
          if gh release view "$SHOU_RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/shou-release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/shou-release-state")" = true || { echo 'Published releases cannot be replaced'; exit 1; }
          else
            gh release create "$SHOU_RELEASE_TAG" --verify-tag --draft --title "Shou $SHOU_RELEASE_TAG" --notes-file ".github/release-notes.md"
          fi
          gh release upload "$SHOU_RELEASE_TAG" "$task_asset_dir/"* --clobber
          gh release edit "$SHOU_RELEASE_TAG" --draft=false --latest
